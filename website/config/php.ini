; PHP settings for The Black History Room (mounted as conf.d/zz-bhr.ini)
expose_php = Off
memory_limit = 256M
upload_max_filesize = 32M
post_max_size = 34M
max_execution_time = 60
max_input_vars = 3000
; OPcache is already on in the official image; give it a bit more room.
opcache.memory_consumption = 128
opcache.max_accelerated_files = 10000
opcache.revalidate_freq = 60
