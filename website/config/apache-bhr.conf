# Apache settings for The Black History Room (mounted into conf-enabled/)

# Real visitor IPs from Traefik (needed for logs and login rate limiting). Docker networks here use 172.16.0.0/12.
LoadModule remoteip_module /usr/lib/apache2/modules/mod_remoteip.so
RemoteIPHeader X-Forwarded-For
RemoteIPTrustedProxy 172.16.0.0/12

ServerTokens Prod
ServerSignature Off

# XML-RPC is not used (n8n will use the REST API with an Application Password).
<Files "xmlrpc.php">
    Require all denied
</Files>

# Never serve config, logs or dot-files.
<FilesMatch "^(wp-config\.php|readme\.html|license\.txt|\.ht.*|.*\.log)$">
    Require all denied
</FilesMatch>

# Browser caching for static files (HTML is not cached here).
<IfModule mod_expires.c>
    ExpiresActive On
    ExpiresByType image/webp "access plus 1 year"
    ExpiresByType image/avif "access plus 1 year"
    ExpiresByType image/jpeg "access plus 1 year"
    ExpiresByType image/png "access plus 1 year"
    ExpiresByType image/svg+xml "access plus 1 year"
    ExpiresByType font/woff2 "access plus 1 year"
    ExpiresByType text/css "access plus 1 month"
    ExpiresByType application/javascript "access plus 1 month"
    ExpiresByType text/javascript "access plus 1 month"
</IfModule>
